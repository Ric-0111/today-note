name: ニュースを更新する

on:
  schedule:
    # 毎日 日本時間の朝6時ごろ（UTCの21:00）。GitHubが混み合うと、数十分おくれることがあります。
    - cron: "0 21 * * *"
  # GitHubの「Actions」画面から、手動でも実行できます
  workflow_dispatch:

# 同時に2つ動かさない
concurrency:
  group: update-news
  cancel-in-progress: false

# このプログラムに許す操作は、リポジトリの書きこみだけ
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ニュースを集める
        run: python scripts/collect_news.py

      - name: 変更があれば保存する
        run: |
          git config user.name "today-note-bot"
          git config user.email "today-note-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更はありませんでした。"
          else
            git commit -m "ニュースを更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
